name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            AUTH_SECRET: ci-only-secret-not-used-in-production
            GOOGLE_CLIENT_ID: ci-placeholder
            GOOGLE_CLIENT_SECRET: ci-placeholder
            GEMINI_API_KEY: ci-placeholder
            MONGODB_URI: mongodb://localhost:27017/pantry_build
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint:check
            - run: npm test
            - run: npm run build

    e2e:
        runs-on: ubuntu-latest
        needs: verify
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
        env:
            CI: true
            AUTH_SECRET: ci-only-secret-not-used-in-production
            AUTH_TRUST_HOST: true
            GOOGLE_CLIENT_ID: ci-placeholder
            GOOGLE_CLIENT_SECRET: ci-placeholder
            GEMINI_API_KEY: ci-placeholder
            MONGODB_URI: mongodb://localhost:27017/pantry_e2e
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
